name: Release

# Publishes corkern when a tag v<version> is pushed: docs/releasing.md.
#   check  → the tag is on main and equals v + the version in pyproject.toml and __version__
#   gate   → the same release gate as CI (release-gate.yml)
#   build  → sdist + wheel built ONCE, gated, uploaded as an artifact; these files are published
#   publish-testpypi → pre-releases (a, b, rc, dev) only, environment `testpypi`
#   publish-pypi     → final versions only, environment `pypi` (waits for a required reviewer)
# Trusted Publishing (OIDC) only: no secrets, no tokens. Third-party actions pinned by commit SHA.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release half-way

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0            # origin/main is needed to check the tag is on it
          persist-credentials: false
      - name: Tag on main, tag == v + version, PEP 440
        id: version
        # The tag name reaches the script only through the runner's GITHUB_REF_NAME variable
        # and is validated there before it is compared or handed to git.
        run: python3 scripts/check_release_version.py tag --tag "$GITHUB_REF_NAME" --branch origin/main

  gate:
    permissions:
      contents: read
    uses: ./.github/workflows/release-gate.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}   # validated PEP 440 by the check job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.23"
          enable-cache: false
      - name: Build sdist + wheel (once; these exact files are published)
        run: |
          uv venv --python 3.12
          uv build -o dist
      - name: dist holds exactly this version's sdist + wheel
        run: .venv/bin/python scripts/check_release_version.py dist --version "$VERSION" dist
      - name: Release gate on the files that will be published
        run: .venv/bin/python scripts/release_gate.py dist
      - name: SHA-256 sums (job summary)
        run: |
          (cd dist && sha256sum -- *) > "$RUNNER_TEMP/SHA256SUMS"
          cat "$RUNNER_TEMP/SHA256SUMS"
          {
            echo "### corkern $VERSION: files to publish (SHA-256)"
            echo '```'
            cat "$RUNNER_TEMP/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish-testpypi:
    needs: [check, gate, build]
    if: needs.check.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/corkern/${{ needs.check.outputs.version }}/
    permissions:
      id-token: write   # Trusted Publishing; nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          attestations: true

  publish-pypi:
    needs: [check, gate, build]
    if: needs.check.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi        # required reviewer: waits for manual approval
      url: https://pypi.org/project/corkern/${{ needs.check.outputs.version }}/
    permissions:
      id-token: write   # Trusted Publishing; nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://upload.pypi.org/legacy/
          packages-dir: dist/
          attestations: true
