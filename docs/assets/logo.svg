<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="corkern">
  <title>corkern</title>
  <defs>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5" fx="0.38" fy="0.34">
      <stop offset="0" stop-color="#FFD58F"/>
      <stop offset="1" stop-color="#F7931E"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.6" stop-color="#FFC46B" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FFC46B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="#23224C"/>
  <circle cx="256" cy="256" r="186" fill="#6A58B8" stroke="#23224C" stroke-width="7"/>
  <g stroke="#23224C" stroke-width="7" stroke-linejoin="round">
    <!-- outer folds: six petals swirling around the core (the cortex) -->
    <ellipse cx="256" cy="140" rx="112" ry="70" fill="#927DE2" transform="rotate(0 256 256) rotate(-14 256 140)"/>
    <ellipse cx="256" cy="140" rx="112" ry="70" fill="#6A58B8" transform="rotate(60 256 256) rotate(-14 256 140)"/>
    <ellipse cx="256" cy="140" rx="112" ry="70" fill="#927DE2" transform="rotate(120 256 256) rotate(-14 256 140)"/>
    <ellipse cx="256" cy="140" rx="112" ry="70" fill="#6A58B8" transform="rotate(180 256 256) rotate(-14 256 140)"/>
    <ellipse cx="256" cy="140" rx="112" ry="70" fill="#927DE2" transform="rotate(240 256 256) rotate(-14 256 140)"/>
    <ellipse cx="256" cy="140" rx="112" ry="70" fill="#6A58B8" transform="rotate(300 256 256) rotate(-14 256 140)"/>
    <!-- inner folds -->
    <ellipse cx="256" cy="180" rx="78" ry="44" fill="#8572D6" transform="rotate(36 256 256) rotate(-24 256 180)"/>
    <ellipse cx="256" cy="180" rx="78" ry="44" fill="#5E4DA8" transform="rotate(108 256 256) rotate(-24 256 180)"/>
    <ellipse cx="256" cy="180" rx="78" ry="44" fill="#8572D6" transform="rotate(180 256 256) rotate(-24 256 180)"/>
    <ellipse cx="256" cy="180" rx="78" ry="44" fill="#5E4DA8" transform="rotate(252 256 256) rotate(-24 256 180)"/>
    <ellipse cx="256" cy="180" rx="78" ry="44" fill="#8572D6" transform="rotate(324 256 256) rotate(-24 256 180)"/>
    <!-- the cavity holding the core (the Kern) -->
    <circle cx="256" cy="256" r="74" fill="#23224C"/>
  </g>
  <circle cx="256" cy="256" r="70" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="44" fill="url(#core)" stroke="#B8741A" stroke-width="3"/>
</svg>
