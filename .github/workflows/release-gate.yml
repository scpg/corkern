name: Release gate

# What would be uploaded to (Test)PyPI, checked before anything is uploaded: docs/release-gate.md.
# Called by ci.yml (every pull request and push to main) and by release.yml (every release tag).
# Every action is pinned by commit SHA, every tool by exact version (+ SHA-256 for binaries).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BANDIT: "bandit==1.9.4"
      PIP_AUDIT: "pip-audit==2.10.1"
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      SHELLCHECK_VERSION: "0.11.0"
      SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0            # gitleaks scans the full history
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.23"
          enable-cache: false
      - name: Install tools (pinned, checksum-verified)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -sSfLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz -C bin gitleaks
          curl -sSfLo shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar xJf shellcheck.tar.xz -C bin --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build wheel + sdist
        run: |
          uv venv --python 3.12
          uv build -o dist
      - name: Release gate (allow-list, secrets, private markers, knowledge repo layout)
        run: .venv/bin/python scripts/release_gate.py dist
      - name: bandit (medium and high)
        run: uvx --from "$BANDIT" bandit -r src/corkern -ll
      - name: shellcheck (hooks, following lib.sh)
        working-directory: src/corkern
        run: shellcheck -x hooks/*.sh
      - name: pip-audit (resolved runtime dependencies)
        run: |
          uv pip compile --universal -q pyproject.toml -o "$RUNNER_TEMP/runtime-requirements.txt"
          uvx --from "$PIP_AUDIT" pip-audit -r "$RUNNER_TEMP/runtime-requirements.txt" --no-deps --disable-pip --strict --progress-spinner off
      - name: gitleaks (full git history)
        run: gitleaks git --no-banner --redact --log-opts="--all" .
      - name: gitleaks (unpacked dist artifacts)
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked/wheel" "$RUNNER_TEMP/unpacked/sdist"
          .venv/bin/python -m zipfile -e dist/*.whl "$RUNNER_TEMP/unpacked/wheel"
          tar xzf dist/*.tar.gz -C "$RUNNER_TEMP/unpacked/sdist"
          gitleaks dir --no-banner --redact "$RUNNER_TEMP/unpacked"
